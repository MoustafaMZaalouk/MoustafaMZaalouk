name: Add profile image
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore prepared technology labels
        shell: python
        run: |
          import base64, pathlib
          pathlib.Path('tech-stack.png').write_bytes(base64.b64decode(''))
      - name: Save image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tech-stack.png
          git diff --cached --quiet || git commit -m 'Add prepared technology labels'
          git push
